---
- name: Remove Nginx from AlmaLinux
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Stop Nginx service
      ansible.builtin.service:
        name: nginx
        state: stopped
      failed_when: false

    - name: Disable Nginx service
      ansible.builtin.service:
        name: nginx
        enabled: false
      failed_when: false

    - name: Remove Nginx package
      ansible.builtin.dnf:
        name: nginx
        state: absent

    - name: Verify Nginx service is removed
      ansible.builtin.command:
        cmd: systemctl is-enabled nginx
      register: nginx_enabled
      changed_when: false
      failed_when: false

    - name: Verify Nginx package is removed
      ansible.builtin.command:
        cmd: rpm -q nginx
      register: nginx_package
      changed_when: false
      failed_when: false

    - name: Display removal status
      ansible.builtin.debug:
        msg:
          - "Nginx service check: {{ nginx_enabled.stdout | default('removed') }}"
          - "Nginx package check: {{ nginx_package.stdout | default('not installed') }}"
